name: Security Scan & SAST Pipeline

on:
  push:
    branches: [ main, android-main ]
  pull_request:
    branches: [ main, android-main ]
  schedule:
    - cron: '0 2 * * 1' # Weekly scan every Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  technology-detection:
    name: Detect Technology Stack
    runs-on: ubuntu-latest
    outputs:
      has_python: ${{ steps.detect.outputs.has_python }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_android: ${{ steps.detect.outputs.has_android }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Technologies
        id: detect
        run: |
          echo "Scanning repository structure..."
          if [ -f "backend/requirements.txt" ] || [ -f "requirements.txt" ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
            echo "Detected Python / FastAPI backend."
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "web/package.json" ] || [ -f "package.json" ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
            echo "Detected Node.js / React frontend."
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            echo "has_android=true" >> "$GITHUB_OUTPUT"
            echo "Detected Android Kotlin / Gradle project."
          else
            echo "has_android=false" >> "$GITHUB_OUTPUT"
          fi

  gitleaks-scan:
    name: Gitleaks Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ARGS: "--redact --report-path=gitleaks-report.json --report-format=json"
        continue-on-error: true

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  semgrep-sast:
    name: Semgrep SAST Code Analysis
    runs-on: ubuntu-latest
    needs: technology-detection
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Security Rules
        run: |
          semgrep scan --config=auto --config=p/owasp-top-ten --config=p/cwe-top-25 --json -o semgrep-report.json || true
          semgrep scan --config=auto --config=p/owasp-top-ten --config=p/cwe-top-25 --sarif -o semgrep.sarif || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

      - name: Upload Semgrep JSON Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json

  trivy-fs-and-deps:
    name: Trivy Filesystem & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy FS Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Run Trivy for Table Output
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-fs-report.json

  security-summary-and-gate:
    name: Security Summary & Policy Gate
    runs-on: ubuntu-latest
    needs: [technology-detection, gitleaks-scan, semgrep-sast, trivy-fs-and-deps]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Evaluate Security Gate and Generate Summary
        id: gate
        run: |
          echo "### 🛡️ OrthofinixAI Security & SAST Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Target | Status | Findings Uploaded |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Gitleaks** | Repository Secrets | ✅ Completed | [Artifact: gitleaks-report] |" >> $GITHUB_STEP_SUMMARY
          echo "| **Semgrep** | Python / FastAPI & Web | ✅ Completed | [Artifact: semgrep-report] |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trivy** | Dependencies & FS | ✅ Completed | [Artifact: trivy-report] |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
          echo "> Security review documentation and Excel scorecard are generated in `security-review.xlsx` and `security-review.md`." >> $GITHUB_STEP_SUMMARY

          CRIT_COUNT=0
          if [ -f "semgrep-report/semgrep-report.json" ]; then
            CRIT_SEMGREP=$(grep -o '"CRITICAL"' semgrep-report/semgrep-report.json | wc -l || true)
            CRIT_COUNT=$((CRIT_COUNT + CRIT_SEMGREP))
          fi

          echo "Total Critical Automated Findings: $CRIT_COUNT"
          if [ "$CRIT_COUNT" -gt 0 ]; then
            echo "::warning::Critical automated vulnerabilities detected. Please review artifacts."
          fi
